name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # see: https://github.com/googleapis/release-please-action/issues/1105
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # NOTE: publish-test & publish jobs removed in this fork.
  # PyPI trusted publishing is bound to the upstream repo (jack-mil/bing-rewards);
  # this private fork cannot publish the bing-rewards package to PyPI.
